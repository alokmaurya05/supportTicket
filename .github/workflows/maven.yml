# This is a basic workflow to help you get started with Actions

name: CI Java app support-ticket with Docker

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn clean install
        # 1. Must upload the JAR from Job 1
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/support-ticket.jar
  docker:
        needs: build
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4

          # 2. Must download the JAR into target/
          - name: Download JAR artifact
            uses: actions/download-artifact@v4
            with:
              name: app-jar
              path: target
          - name: Login to Docker Hub
            uses: docker/login-action@v4
            with:
              username: ${{ secrets.DOCKERHUB_USERNAME }}
              password: ${{ secrets.DOCKERHUB_PASSWORD }}
          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v4
          - name: Build and push
            uses: docker/build-push-action@v7
            with:
              context: .
              push: true
              tags: |
                alokmaurya05/support-ticket:v1
                alokmaurya05/support-ticket:latest
